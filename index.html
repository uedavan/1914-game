<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社会化シュミレーション | 1914 世界大戦への連鎖</title>
<style>
:root{--ink:#253348;--muted:#61718a;--paper:#f5f0e5;--blue:#24558a;--gold:#b7873e;--line:#d7cbb7;--red:#a9534b;--green:#347969}*{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:17px;line-height:1.65}button,textarea{font:inherit;font-size:16px}button{cursor:pointer;min-height:46px;border-radius:12px;border:1px solid #a7b4c5;background:#fff;color:var(--ink);padding:10px 17px;font-weight:700}button:focus-visible,textarea:focus-visible{outline:3px solid #4d90d6;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:white;border-color:var(--blue)}.shell{max-width:1080px;margin:auto;padding:22px 20px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:2px solid var(--gold);padding-bottom:14px}.brand{font-weight:900;letter-spacing:.04em;font-size:clamp(20px,3vw,28px)}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--muted);font-weight:800}.sub{color:var(--muted);font-size:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,34px);margin-top:18px;box-shadow:0 6px 20px #4d402015}.hero{background:linear-gradient(135deg,#213f5b,#45617a);color:#fff;min-height:350px;display:flex;flex-direction:column;justify-content:center}.hero .sub{color:#d8e4ed}.hero h1{font-family:serif;font-size:clamp(35px,6vw,62px);margin:10px 0}.hero p{max-width:670px}.hero button{align-self:flex-start;margin-top:14px}.chapter{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.chapter h1{font-size:clamp(24px,3vw,35px);margin:3px 0}.progress{height:8px;background:#d6dce3;border-radius:10px;overflow:hidden;margin-top:16px}.progress>div{height:100%;background:var(--gold);transition:width .2s}.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px}.map{position:relative;background:#e5e0cf;border:1px solid #bcb39d;border-radius:14px;min-height:335px;overflow:hidden;padding:12px}.map::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,#9eaaad1a 40px),repeating-linear-gradient(90deg,transparent 0 39px,#9eaaad1a 40px);pointer-events:none}.map-title{position:relative;font-size:13px;font-weight:800;color:#506070}.nodes{position:relative;height:280px}.nation{position:absolute;transform:translate(-50%,-50%);min-width:70px;max-width:108px;padding:5px 7px;min-height:44px;font-size:12px;line-height:1.25;border-radius:9px;border:2px solid #b1a58e;background:#fffaf1;box-shadow:0 2px 5px #0002;z-index:2;white-space:normal}.nation.entente{border-color:#4776ad}.nation.central{border-color:#b96953}.nation.active.entente{background:#b9d4ee}.nation.active.central{background:#efc2ae}.nation.active.other{background:#e4c783}.nation.selected{outline:3px solid #e0ac39;outline-offset:2px}.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#5c6876;margin-top:7px}.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}.fact{background:white;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;margin:12px 0}.hypo{background:#fff7e6;border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;margin:12px 0}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:white}.choice.selected{background:#dceaf7;border:2px solid var(--blue)}.actions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:20px}.tag{display:inline-block;background:#e7e0d3;color:#4d5a6d;font-size:13px;font-weight:800;border-radius:100px;padding:3px 11px}.timeline{border-left:3px solid #c9ae7d;margin-left:9px;padding-left:20px}.event{margin:0 0 15px;position:relative}.event:before{content:"";position:absolute;left:-28px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--gold)}.event strong{display:block}.event span{color:var(--muted);font-size:14px}textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #a7b4c5;border-radius:10px;padding:12px;background:white}.reflection{margin:16px 0}.reflection label{display:block;font-weight:800;margin-bottom:8px}.footer{position:fixed;bottom:0;right:0;left:0;background:#f7f4edec;border-top:1px solid #d3c9b8;padding:7px 17px;text-align:right;font-size:12px;color:#566271;z-index:10}.info{font-size:14px;color:var(--muted)}@media(max-width:720px){.shell{padding:12px 12px 80px}.cols{grid-template-columns:1fr}.panel{margin-top:12px}.map{min-height:320px}.top{align-items:flex-start}.brand{font-size:19px}.nation{min-width:62px;font-size:11px}.hero{min-height:400px}}
</style>
</head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">HISTORY SIMULATION / 1914</div><div class="brand">社会化シュミレーション</div></div><div class="sub">第一次世界大戦と日本<br>中学校3年生</div></header><div id="app" aria-live="polite"><section class="panel hero"><h1>世界大戦への連鎖</h1><p>ゲームを読み込んでいます。表示が変わらない場合はSafariやChromeで開いてください。</p></section></div></main><footer class="footer">©2026 上田伴</footer>
<script>
'use strict';
/* 変更しやすいよう、歴史データと画面制御を分離しています。外部通信・ライブラリ不要。 */
const stages=[
 {chapter:1,date:'1914年以前',title:'対立するヨーロッパ',text:'ドイツ・オーストリア・イタリアの三国同盟と、イギリス・フランス・ロシアの三国協商。バルカン半島でも民族問題が緊張を高めていた。',role:'ヨーロッパの外交担当者',question:'緊張を弱めるには、どの対応を重視する？',choices:[['各国と対話し、対立点を整理する','対話の機会は増えるが、植民地や民族問題などの利害は残る。'],['軍事力と同盟関係を強める','抑止を期待できる一方、相手国の警戒や軍備競争を強めるおそれがある。']],fact:'三国同盟と三国協商を軸に対立が深まった。ただし同盟関係だけで各国の行動が決まったわけではない。イタリアは1914年には中立を保った。',active:[]},
 {chapter:2,date:'1914年6月28日〜7月28日',title:'サラエボ事件',text:'オーストリアの皇位継承者夫妻がサラエボで暗殺された。オーストリア政府はセルビアへの対応を迫られた。',role:'オーストリア＝ハンガリー帝国の政府',question:'セルビアへの対応をどうする？',choices:[['強い要求を突きつける','強い圧力をかけられるが、セルビアやロシアとの対立が激しくなるおそれがある。'],['交渉による解決を重視する','衝突を避ける余地は生まれるが、対立が解消するとは限らない。'],['ドイツとの協議を優先する','同盟国の支援を確認できる一方、強硬な対応を後押しする可能性もある。']],fact:'オーストリアはドイツの支持を得てセルビアに最後通牒を出し、1914年7月28日に宣戦布告した。セルビアは要求の大部分を受け入れたが、合意には至らなかった。',active:['オーストリア','セルビア']},
 {chapter:3,date:'1914年7月末〜8月3日',title:'宣戦布告の連鎖',text:'ロシアはセルビアを支援し、ドイツはロシアとフランスに宣戦布告した。対立は二国間からヨーロッパへ広がった。',role:'ドイツ政府',question:'ロシアの動員とフランスとの対立にどう対応する？',choices:[['軍事計画を優先する','先に動ける可能性はあるが、他国との戦争を拡大させる危険が高い。'],['外交交渉の継続を試みる','衝突回避の余地を探れるが、各国の動員や不信感が障害となる。']],fact:'ドイツは8月1日にロシア、8月3日にフランスへ宣戦布告した。ロシアのセルビア支援、独仏対立、動員計画などが連鎖した。',active:['オーストリア','セルビア','ロシア','ドイツ','フランス']},
 {chapter:4,date:'1914年8月4日',title:'イギリスの参戦',text:'ドイツ軍は中立国ベルギーに侵攻した。イギリスはベルギーの中立とヨーロッパの勢力均衡を重視していた。',role:'イギリス政府',question:'ドイツのベルギー侵攻にどう対応する？',choices:[['ドイツに撤退を要求し、応じなければ参戦する','ベルギーの中立を守ろうとするが、戦争の規模が拡大する。'],['中立を維持し外交を続ける','直ちに参戦する負担は避けられるが、ベルギーやフランスへの影響力が弱まるおそれがある。']],fact:'イギリスはベルギーの中立侵害などを理由に8月4日にドイツへ宣戦布告した。三国協商の存在だけが参戦理由ではない。',active:['オーストリア','セルビア','ロシア','ドイツ','フランス','イギリス','ベルギー']},
 {chapter:5,date:'1914年8月23日',title:'日本の参戦',text:'日本はイギリスと日英同盟を結んでいた。東アジア・太平洋のドイツ権益も、日本にとって重要な問題だった。',role:'日本政府',question:'ヨーロッパで始まった戦争にどう対応する？',choices:[['ドイツに対して参戦する','イギリスとの協力や地域での権益拡大が期待できるが、戦争の負担や国際的な緊張も生じる。'],['中立を保つ','戦争への直接参加を避けられるが、同盟国との関係や東アジアでの機会に影響する可能性がある。'],['外交的な働きかけを優先する','武力行使を避ける余地がある一方、ドイツの権益をめぐる対立が解消するとは限らない。']],fact:'日本は8月15日にドイツへ最後通牒を出し、8月23日に宣戦布告した。日英同盟を背景に、山東半島の青島や太平洋のドイツ権益をめぐる利害も関係した。',active:['オーストリア','セルビア','ロシア','ドイツ','フランス','イギリス','ベルギー','日本']}
];
/* 位置は地理的な厳密な座標ではなく、関係を学ぶための模式的な配置です。 */
const nations=[{n:'イギリス',x:14,y:28,side:'entente',desc:'フランス・ロシアと三国協商。ベルギーの中立と勢力均衡を重視。'},{n:'フランス',x:31,y:54,side:'entente',desc:'ロシアと同盟関係。ドイツと対立。'},{n:'ベルギー',x:33,y:27,side:'other',desc:'1914年に中立国だったが、ドイツ軍の侵攻を受けた。'},{n:'ドイツ',x:51,y:40,side:'central',desc:'オーストリアと同盟。ロシア・フランスと戦争に入った。'},{n:'オーストリア',x:62,y:68,side:'central',desc:'セルビアとの対立から1914年7月28日に宣戦布告。'},{n:'イタリア',x:40,y:83,side:'other',desc:'三国同盟の一員だったが、1914年は中立。1915年に協商国側で参戦。'},{n:'セルビア',x:76,y:85,side:'other',desc:'サラエボ事件後、オーストリアから最後通牒を受けた。'},{n:'ロシア',x:82,y:24,side:'entente',desc:'セルビアを支援し、フランスと同盟関係にあった。'},{n:'日本',x:92,y:51,side:'entente',desc:'日英同盟を背景に1914年8月23日ドイツに宣戦布告。'}];
const links=[['ドイツ','オーストリア','#b96953'],['フランス','ロシア','#4776ad'],['イギリス','フランス','#4776ad'],['イギリス','ロシア','#4776ad'],['イギリス','日本','#639b8a']];
const chronology=[['1914年6月28日','サラエボ事件'],['7月28日','オーストリアがセルビアに宣戦布告'],['8月1日','ドイツがロシアに宣戦布告'],['8月3日','ドイツがフランスに宣戦布告'],['8月4日','ドイツのベルギー侵攻を受け、イギリスがドイツに宣戦布告'],['8月23日','日本がドイツに宣戦布告']];
let page=-1;let phase='choose';let selected=null;let answers={};let selectedNation=null;let reflections=['',''];const app=document.getElementById('app');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mapHTML(stage){const active=stage.active;const line=links.map(([a,b,color])=>{const p=nations.find(x=>x.n===a),q=nations.find(x=>x.n===b);return `<line x1="${p.x}%" y1="${p.y}%" x2="${q.x}%" y2="${q.y}%" stroke="${color}" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>`;}).join('');return `<div class="map"><div class="map-title">国際関係の模式図（国境・距離は正確ではありません）</div><div class="nodes"><svg class="links" aria-hidden="true">${line}</svg>${nations.map(x=>`<button class="nation ${x.side} ${active.includes(x.n)?'active':''} ${selectedNation===x.n?'selected':''}" style="left:${x.x}%;top:${x.y}%" data-nation="${x.n}" aria-label="${x.n}の説明を表示">${x.n}</button>`).join('')}</div><div class="legend"><span><i class="swatch" style="background:#b9d4ee"></i>協商側の参戦国</span><span><i class="swatch" style="background:#efc2ae"></i>同盟側の参戦国</span><span><i class="swatch" style="background:#e4c783"></i>その他の参戦国</span><span>白：この時点では未参戦</span></div></div><div class="fact"><strong>${selectedNation?escapeHTML(selectedNation):'国名をタップ'}</strong><br>${selectedNation?escapeHTML(nations.find(n=>n.n===selectedNation).desc):'国ごとの立場・関係を確認できます。'}</div>`;}
function render(){if(page===-1){app.innerHTML=`<section class="panel hero"><div class="eyebrow" style="color:#e6d0a0">INTERACTIVE HISTORY · 1914</div><h1>世界大戦への連鎖</h1><p>一つの事件が、なぜ世界規模の戦争へと広がったのか。各国の立場で判断し、実際の歴史と比べながら追体験しよう。</p><p class="sub">全6章 / 判断場面5回 / 約8〜12分</p><button class="primary" id="start">ゲーム開始 →</button></section><section class="panel"><strong>学習の問い</strong><p>第一次世界大戦はどのように拡大し、日本はなぜ参戦したのだろうか。</p><p class="info">これは歴史学習用の教材です。選択結果は仮説であり、実際の歴史とは区別して表示します。</p></section>`;document.getElementById('start').onclick=()=>{page=0;render()};return;}
 if(page===5){renderEnd();return;}
 const s=stages[page];let answer=answers[page];let choices=s.choices.map((c,i)=>`<button class="choice ${selected===i?'selected':''}" data-choice="${i}" aria-pressed="${selected===i}">${String.fromCharCode(65+i)}. ${escapeHTML(c[0])}</button>`).join('');app.innerHTML=`<section class="panel"><div class="chapter"><div><div class="eyebrow">CHAPTER ${s.chapter} / 6 · ${s.date}</div><h1>${s.title}</h1></div><span class="tag">${page+1} / 6章</span></div><div class="progress"><div style="width:${(page+1)/6*100}%"></div></div></section><section class="cols"><div class="panel">${mapHTML(s)}</div><div class="panel"><span class="tag">史実に基づく状況</span><p>${s.text}</p><div class="sub">あなたの役割：${s.role}</div><h2 style="font-size:22px">${s.question}</h2>${phase==='choose'?`<div id="choices">${choices}</div><p class="info">正解を当てる問題ではありません。各国の利害と影響を考えましょう。</p>`:`<div class="hypo"><strong>あなたの選択と考えられる影響（仮想）</strong><p>${escapeHTML(s.choices[answer][0])}</p><p>${escapeHTML(s.choices[answer][1])}</p></div><div class="fact"><strong>実際の歴史（史実）</strong><p>${s.fact}</p></div>`}<div class="actions"><button id="back">← 戻る</button>${phase==='choose'?`<button class="primary" id="decide" ${selected===null?'disabled':''}>選択する</button>`:`<button class="primary" id="next">${page===4?'振り返りへ':'次の出来事へ'} →</button>`}</div></div></section>`;
 document.querySelectorAll('[data-nation]').forEach(b=>b.onclick=()=>{selectedNation=b.dataset.nation;render()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);render()});document.getElementById('back').onclick=()=>{if(phase==='result'){phase='choose';selected=answers[page]}else if(page>0){page--;phase=answers[page]!==undefined?'result':'choose';selected=answers[page]??null}else{page=-1}selectedNation=null;render()};const decide=document.getElementById('decide');if(decide)decide.onclick=()=>{if(selected===null)return;answers[page]=selected;phase='result';render()};const next=document.getElementById('next');if(next)next.onclick=()=>{page++;phase=answers[page]!==undefined?'result':'choose';selected=answers[page]??null;selectedNation=null;render()};}
function renderEnd(){app.innerHTML=`<section class="panel"><div class="eyebrow">CHAPTER 6 / 6 · 振り返り</div><h1>世界大戦への連鎖を振り返る</h1><div class="progress"><div style="width:100%"></div></div><p>戦争の拡大には、同盟・協商だけでなく、民族問題、軍事計画、各国の安全保障や権益が関わっていた。</p><div class="cols"><div><h2>1914年の主な出来事</h2><div class="timeline">${chronology.map(e=>`<div class="event"><strong>${e[0]}</strong><span>${e[1]}</span></div>`).join('')}</div></div><div><h2>自分の判断を確認</h2>${stages.map((s,i)=>`<p><strong>${i+1}. ${s.title}</strong><br><span class="sub">${answers[i]!==undefined?escapeHTML(s.choices[answers[i]][0]):'未選択'}</span></p>`).join('')}</div></div><div class="reflection"><label for="r1">① なぜ第一次世界大戦は世界規模に拡大したのだろう？</label><textarea id="r1" placeholder="同盟関係だけでなく、各国の立場や利害にも注目しよう。">${escapeHTML(reflections[0])}</textarea></div><div class="reflection"><label for="r2">② 日本はなぜ参戦したのだろう？</label><textarea id="r2" placeholder="日英同盟と東アジア・太平洋での利害を考えよう。">${escapeHTML(reflections[1])}</textarea></div><div class="fact"><strong>考えるためのヒント</strong><p>ヨーロッパでは、セルビアとオーストリアの対立にロシアやドイツなどが関わり、ベルギー侵攻を受けてイギリスも参戦した。日本は日英同盟と地域の権益を背景に参戦した。</p></div><div class="actions"><button id="back">← 日本の参戦に戻る</button><button id="restart" class="primary">最初からやり直す</button></div></section>`;document.querySelectorAll('textarea').forEach((t,i)=>t.addEventListener('input',()=>reflections[i]=t.value));document.getElementById('back').onclick=()=>{page=4;phase='result';selected=answers[4];render()};document.getElementById('restart').onclick=()=>{if(!confirm('最初からやり直しますか？ 選択と振り返りの入力内容が消えます。'))return;page=-1;phase='choose';selected=null;answers={};selectedNation=null;reflections=['',''];render()};}
render();
</script></body></html>
